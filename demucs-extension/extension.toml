id = "dawai.demucs"
name = "Demucs Source Separation"
version = "0.1.0"
description = "Split audio into stems (drums, bass, vocals, other) using Meta's HTDemucs model"
author = "DAWAI"
extension_type = "wasm"
main = "extension.wasm"
tags = ["ai", "audio", "stems"]

# Burn ABI pin — the .wasm component links burn 0.21's `OperationIr`
# serialization. Host rejects activation if it links a different
# version because the wire format is unstable across burn releases.
requires-burn-abi = "0.21"

[permissions]
network = true
storage = true
allowed_hosts = ["huggingface.co", "hf.co"]

[[contributes.commands]]
id = "demucs.download"
title = "Download HTDemucs Model"

[[contributes.commands]]
id = "demucs.load"
title = "Load HTDemucs Model"

[[contributes.commands]]
id = "demucs.separate"
title = "Separate Stems"

# Test-only: round-trips a 3-element tensor through the WIT `burn`
# interface (`Tensor::from_data` → `add_scalar` → `into_data`). The
# dawai-extension-testkit smoke test calls this to verify the
# router transport without needing the full HTDemucs model.
[[contributes.commands]]
id = "demucs.burn_smoke"
title = "Burn Router Smoke Test"

# Test-only: full Demucs::separate on a short synthetic stereo signal
# through the WIT `burn` interface. Requires cached weights staged
# into the extension's storage dir.
[[contributes.commands]]
id = "demucs.full_smoke"
title = "Demucs Full E2E Smoke Test"

[[contributes.panels]]
id = "dawai.demucs"
name = "Demucs Source Separation"
icon_svg = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>"""
default_width = 320.0
default_height = 400.0
ui = "panel.json"
