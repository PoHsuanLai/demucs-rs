[package]
name = "demucs-extension"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WIT bindings
wit-bindgen = "0.53"

# JSON serialization (for gpu.run tensor I/O and command args)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# STFT preprocessing for ONNX path
rustfft = "6"

# WAV writing for stem output
hound = "3.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
