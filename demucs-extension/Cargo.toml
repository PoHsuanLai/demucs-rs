[package]
name = "demucs-extension"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Burn/safetensors CPU fallback
demucs-core = { path = "../demucs-core", features = ["ndarray"] }
burn = { version = "0.20.1", default-features = false, features = ["ndarray", "std"] }

# WIT bindings
wit-bindgen = "0.53"

# JSON serialization (for gpu.run tensor I/O and command args)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async blocking (for Burn's async API)
pollster = "0.4"

# STFT preprocessing for ONNX path
rustfft = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
