[package]
name = "demucs-extension"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
demucs-core = { path = "../demucs-core", features = ["ndarray"] }
burn = { version = "0.20.1", default-features = false, features = ["ndarray", "std"] }
wit-bindgen = "0.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
