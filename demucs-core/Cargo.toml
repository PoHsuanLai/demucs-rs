[package]
name = "demucs-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
ndarray = ["burn/ndarray"]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
autotune = ["burn/autotune"]
fusion = ["burn/fusion"]

[dependencies]
realfft = "3.5.0"
burn = { version = "0.21" }
safetensors = "0.5"
half = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5"

[dev-dependencies]
# `wgpu` for the `wgpu_smoke` E2E test; `ndarray` for the
# `stem_sum` test that runs on CPU.
burn = { version = "0.21", features = ["ndarray", "wgpu"] }
safetensors = "0.5"
pollster = "0.4"
bytemuck = "1"
hound = "3"
